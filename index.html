<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Torneio de Apostas</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="painel">

        <header class="cabecalho">
            <div>
                <h1>Painel do Torneio</h1>
                <p>Configuração do evento</p>
            </div>

            <button class="btn-sair" onclick="sair()">
                Sair
            </button>
        </header>


        <!-- ========================= -->
        <!-- INFORMAÇÕES DO TORNEIO -->
        <!-- ========================= -->

        <section class="card">

            <h2>Informações do Torneio</h2>

            <div class="form-grid">

                <div class="campo">
                    <label for="nomeTorneio">
                        Nome do Torneio
                    </label>

                    <input
                        id="nomeTorneio"
                        type="text"
                        placeholder="Ex.: Torneio de Verão"
                        oninput="salvarTorneio()"
                    >
                </div>


                <div class="campo">
                    <label for="inscricao">
                        Valor da Inscrição
                    </label>

                    <input
                        id="inscricao"
                        type="number"
                        min="0"
                        step="0.01"
                        placeholder="R$ 0,00"
                        oninput="salvarTorneio()"
                    >
                </div>

            </div>

        </section>


        <!-- ========================= -->
        <!-- GRUPOS -->
        <!-- ========================= -->

        <!-- ========================= -->
<!-- GRUPOS -->
<!-- ========================= -->

<section class="card">

    <h2>Grupos</h2>


    <!-- QUANTIDADE DE GRUPOS -->

    <div class="campo">

        <label for="quantidadeGrupos">
            Quantidade de grupos
        </label>

        <select
            id="quantidadeGrupos"
            onchange="alterarQuantidadeGrupos()"
        >

            <option value="">
                Selecione a quantidade
            </option>

            <option value="1">
                1 grupo
            </option>

            <option value="2">
                2 grupos
            </option>

            <option value="3">
                3 grupos
            </option>

            <option value="4">
                4 grupos
            </option>

            <option value="5">
                5 grupos
            </option>

            <option value="6">
                6 grupos
            </option>

        </select>

    </div>


    <!--
        AS JANELAS DOS GRUPOS
        SERÃO CRIADAS AQUI
    -->

    <div
        id="gruposContainer"
        class="grupos-container"
    >

    </div>

</section>


        <!-- ========================= -->
        <!-- LUTAS -->
        <!-- ========================= -->

        <section class="card">

            <h2>Criar Luta</h2>

            <div class="luta-criacao">

                <div class="campo">

                    <label for="lutadorA">
                        Participante do Grupo A
                    </label>

                    <select id="lutadorA"></select>

                </div>


                <div class="versus">
                    VS
                </div>


                <div class="campo">

                    <label for="lutadorB">
                        Participante do Grupo B
                    </label>

                    <select id="lutadorB"></select>

                </div>


                <button
                    class="btn-principal"
                    onclick="criarLuta()"
                >
                    Criar Luta
                </button>

            </div>

        </section>

         <!-- ========================= -->
        <!-- LUTAS CADASTRADAS -->
        <!-- ========================= -->

        <section class="card">

            <h2>
                Lutas Cadastradas
            </h2>


            <div
                id="lutas"
                class="lista-lutas"
            >

                <p class="vazio">
                    Nenhuma luta cadastrada.
                </p>

            </div>

        </section>




        <!-- ========================= -->
        <!-- CONCLUIR -->
        <!-- ========================= -->

        <section class="concluir-area">

            <button
                class="btn-concluir"
                onclick="concluirTorneio()"
            >
                CONCLUIR CONFIGURAÇÃO
            </button>

        </section>
       

<script src="js/auth.js"></script>
<script src="js/grupos.js"></script>
<script src="js/lutas.js"></script>
<script src="js/apostas.js"></script>
<script src="js/financeiro.js"></script>
<script src="js/app.js"></script>

</body>
</html>
